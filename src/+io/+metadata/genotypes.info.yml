# Follow this format to add new strains/genotypes:
# --------------------------------------------------------------
# - strain: STRAIN_NAME
#   combo:
#     female:
#       - GENOTYPE_1
#       - GENOTYPE_2
#       - ...
#     male:
#       - GENOTYPE_1
#       - GENOTYPE_2
#       - ...
#   normalize:
#     - GENOTYPE_CANONICAL_NAME_1:
#       - GENOTYPE_VARIANT_1
#       - GENOTYPE_VARIANT_2
#
#
# --------------------------------------------------------------

# Each strain must have both male and female in combo
# If such combo does not exist, simply leave the content inside male/female empty:
# --------------------------------------------------------------
# - strain: STRAIN_NAME
#   combo:
#     female:
#     male:
#       - GENOTYPE_1
#       - GENOTYPE_2
# --------------------------------------------------------------
#
# Possible genotypes are (case-insensitive): 
#   - WT
#   - Het
#   - Hem (Hemizygous)
#   - Hom
#
# If your input contains variants of the above genotypes, you can normalize them using the "normalize" field.
# For example, Mecp2 male "Knockout" is a Hemizygous genotype, but commonly referred to as "KO" in places.
# To ensure consistency, you can normalize "Knockout" or "KO" to "Hem" using the normalize field:
#   normalize:
#     - Hem: ["Knockout", "KO"]
#
# A canonical name defined must be one of the possible genotypes for that strain & sex combo. Normalization is case-insensitive.
#

- strain: C57BL/6J
  combo:
    female:
      - WT
    male:
      - WT

- strain: CBA/J
  combo:
    female:
      - WT
    male:
      - WT

- strain: CBA/CaJ
  combo:
    female:
      - WT
    male:
      - WT

- strain: Shank3B
  combo:
    female:
      - WT
      - HET
      - HOM
    male:
      - WT
      - HET
      - HOM
  normalize:
    - HOM: ["KO", "Knockout"]

- strain: Cntnap2
  combo:
    female:
      - HOM
    male:
      - HOM
  normalize:
    - HOM: ["KO", "Knockout"]

- strain: Mecp2
  combo:
    female:
      - WT
      - HET
    male:
      - WT
      - HEM # Hemizygous, knockout/KO
  normalize:
    - HEM: ["KO", "Knockout"]